name: SLCK Selcuk Guncelleyici

on:
  schedule:
    - cron: '*/10 * * * *'   # her 10 dakikada bir
  workflow_dispatch:          # elle tetikleme

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu cek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Scripti calistir (selcuk.py)
      run: python selcuk.py

    - name: Degisiklik Kontrolu
      run: |
        git diff --quiet . || echo "degisiklik=true" >> $GITHUB_OUTPUT
        
    - name: Degisikleri Commit Et
      if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add selcuk.py 5.m3u
        git commit -m "🔄 SLCK guncellemesi: $(date)" -m "📺 Otomatik guncelleme - playlist korunuyor" || exit 0
        git push